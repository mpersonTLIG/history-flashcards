<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ancient Greece & Rome Flashcards</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:0;padding:24px;text-align:center}main{max-width:820px;margin:auto}h1{color:#173b70}select,button{font-size:17px;padding:12px 16px;border-radius:10px;border:1px solid #aabbd0;margin:5px;cursor:pointer}button{background:#164a8b;color:white;border:0}button:hover{background:#0c3263}button:focus-visible,.card:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}.card{background:white;min-height:260px;border-radius:18px;box-shadow:0 6px 20px #0002;margin:24px auto;display:flex;align-items:center;justify-content:center;padding:26px;box-sizing:border-box;cursor:pointer;font-size:clamp(22px,4vw,32px);font-weight:600;line-height:1.4;overflow-wrap:anywhere}.card.back{background:#e1f1ff;font-size:clamp(19px,3vw,25px);font-weight:400}.hint{font-size:14px;color:#526579}.counter{font-weight:bold;margin-top:18px}footer{font-size:13px;color:#64748b;margin-top:20px}</style></head><body><main><h1>Ancient Greece & Ancient Rome Flashcards</h1><label for="set">Choose a vocabulary set: </label><select id="set"><option value="Greece">Ancient Greece (11)</option><option value="Rome">Ancient Rome (11)</option><option value="All">Both Civilizations (22)</option></select><div class="counter" id="counter" aria-live="polite"></div><div id="card" class="card" role="button" tabindex="0" aria-label="Flip flashcard"></div><p class="hint">Click the card or press Space to flip it.</p><div><button id="prev">← Previous</button><button id="flip">Flip Card</button><button id="next">Next →</button><button id="shuffle">Shuffle</button></div><footer>Ad-free classroom flashcards • Works offline</footer></main><script>const sets={"Greece": [["oligarchy", "A government ruled by a few powerful people"], ["tyrant", "a cruel and oppressive ruler"], ["Assembly", "a group of citizens, in an ancient Greek democracy, with the power to pass laws"], ["potsherds", "fragments of pottery"], ["democracy", "A form of government in which citizens govern themselves"], ["myth", "A traditional story about gods, ancestors, or heroes, told to explain the natural world or the customs and beliefs of a society."], ["philosopher", "a person who searches for wisdom or enlightenment"], ["amphitheater", "a large open-air theater built in a semicircular pattern, with ascending rows of seats built into a hillside"], ["fable", "A brief story that leads to a moral, often using animals as characters"], ["theorem", "A mathematical statement which we can prove to be true"], ["abacus", "a calculator that performs arithmetic functions by manually sliding counters on rods or in grooves"]], "Rome": [["consul", "An official who was elected in the Roman government to serve for 1 year."], ["gladiator", "An armed person who fought animals or other people in an arena such as the Colosseum."], ["The Gospels", "The first four books of the New Testament (Matthew, Mark, Luke, John), which tell the life of Jesus and what He did for us on the cross."], ["patrician", "A member of the wealthy ruling class in ancient Rome."], ["Pax Romana", "The period of peace in the Roman Empire that began with the reign of Octavian."], ["plebian", "A member of the working class in ancient Rome."], ["republic", "A government ruled by representatives chosen by the people."], ["Roman Forum", "A public meeting place in ancient Rome."], ["Senate", "The most powerful branch of the government in the Roman Republic."], ["toga", "A loose robe worn by citizens of ancient Rome."], ["triumvirate", "An alliance among three rulers."]]};let cards=[],i=0,back=false;const $=id=>document.getElementById(id);function load(){let s=$('set').value;cards=(s==='All'?[...sets.Greece,...sets.Rome]:sets[s]).map(x=>[...x]);i=0;back=false;render()}function render(){let c=$('card');c.textContent=cards[i][back?1:0];c.classList.toggle('back',back);$('counter').textContent=`Card ${i+1} of ${cards.length} • ${back?'Definition':'Term'}`;}function flip(){back=!back;render()}function move(n){i=(i+n+cards.length)%cards.length;back=false;render()}$('set').addEventListener('change',load);$('card').addEventListener('click',flip);$('card').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});$('flip').addEventListener('click',flip);$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('shuffle').addEventListener('click',()=>{for(let j=cards.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[cards[j],cards[k]]=[cards[k],cards[j]]}i=0;back=false;render()});load();</script></body></html>
