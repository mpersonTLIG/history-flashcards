<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ancient Israel & Persia Flashcards</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f0f4fa;color:#172b4d;text-align:center;margin:0;padding:25px}main{max-width:850px;margin:auto}h1{color:#173b70}select,button{font-size:17px;padding:12px 16px;border-radius:10px;margin:5px}select{border:1px solid #9bb0c9}button{background:#174a8b;color:white;border:0;cursor:pointer}button:hover{background:#0c3263}button:focus-visible,#card:focus-visible{outline:3px solid #ffae00}.card{background:white;min-height:260px;padding:35px 25px;margin:25px auto;border-radius:18px;box-shadow:0 6px 20px #0002;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,4vw,34px);font-weight:700;line-height:1.4;cursor:pointer}.card.back{background:#e0efff;font-size:clamp(19px,3vw,26px);font-weight:400}.counter{font-weight:700;margin-top:18px}.hint,footer{color:#53657d;font-size:14px}footer{margin-top:25px}</style></head><body><main><h1>Ancient Israel & Ancient Persia Flashcards</h1><label for="set">Choose vocabulary: </label><select id="set"><option value="All">Both Civilizations (22 Terms)</option><option value="Israel">Ancient Israel (11 Terms)</option><option value="Persia">Ancient Persia (11 Terms)</option></select><div id="counter" class="counter"></div><div id="card" class="card" role="button" tabindex="0" aria-label="Flip flashcard"></div><p class="hint">Click the card or press Space/Enter to flip.</p><div><button id="prev">← Previous</button><button id="flip">Flip Card</button><button id="next">Next →</button><button id="shuffle">Shuffle</button></div><footer>Ad-free classroom flashcards • Works offline</footer></main><script>const sets={"Israel": [["Exodus", "The Second Book of The Bible; The Israelites' departure from Egypt."], ["The Tabernacle", "The portable place of worship used by the Israelites in the wilderness; symbolized God's presence with his people."], ["The Diaspora", "the scattering of the Israelites to many other nations at the time of the Babylonian captivity."], ["Septuagint", "a Greek translation of the Old Testament."], ["Gentiles", "a name given to Greeks and other people who are not Jews."], ["The Messiah", "The Christ; Who was anointed to save His people"], ["Judaism", "the monotheistic religion of the Jews"], ["synagogue", "a place where the Jews gather for prayer, Scripture reading, and religious instruction."], ["rabbi", "a Jewish religious teacher"], ["Yahweh", "the Hebrew name for God"], ["Samaritans", "Descendants of a mixed population of Israelites"]], "Persia": [["Avesta", "The sacred writings of Zoroastrianism"], ["daric", "The coin used in the Persian Empire named after Darius"], ["immortal", "A special soldier for the king in ancient Persia"], ["magi", "The name for the priest in ancient Persia"], ["satrap", "A governor in Persia who ruled a particular province. He was responsible for collecting tribute for King Darius and reporting to him."], ["satrapy", "A province in ancient Persia"], ["Royal road", "The longest stone road in the Persian Empire, stretching over 1,600 miles from Susa to Sardis"], ["Zoroastrianism", "A religion that developed in early Persia and stressed the fight between the forces of good and the forces of evil and how eventually the forces of good would prevail."], ["Persian Wars", "A series of wars between the Greeks (mainly Athens) and the Persians in which the Greeks were usually victorious."], ["tribute", "Money paid for protection"], ["foretell", "To prophesy a future event, such as God giving Isaiah the prophecy about God using Cyrus to help the Israelites"]]};let cards=[],index=0,flipped=false;const el=id=>document.getElementById(id);function load(){let s=el('set').value;cards=(s==='All'?[...sets.Israel,...sets.Persia]:sets[s]).map(x=>[...x]);index=0;flipped=false;render()}function render(){let c=el('card');c.textContent=cards[index][flipped?1:0];c.classList.toggle('back',flipped);el('counter').textContent=`Card ${index+1} of ${cards.length} · ${flipped?'Definition':'Term'}`}function flip(){flipped=!flipped;render()}function move(d){index=(index+d+cards.length)%cards.length;flipped=false;render()}el('set').addEventListener('change',load);el('card').addEventListener('click',flip);el('card').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}});el('flip').addEventListener('click',flip);el('prev').addEventListener('click',()=>move(-1));el('next').addEventListener('click',()=>move(1));el('shuffle').addEventListener('click',()=>{for(let j=cards.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[cards[j],cards[k]]=[cards[k],cards[j]]}index=0;flipped=false;render()});load();</script></body></html>
